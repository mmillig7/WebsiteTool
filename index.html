<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0e13">
  <title>Collage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="controls">
      <h1>Collage</h1>

      <div class="slider">
        <div class="slider-top">
          <label for="width">Width</label>
          <output id="width-out" for="width">880</output>
        </div>
        <input id="width" type="range" min="360" max="1400" value="880" step="20">
      </div>

      <div class="slider">
        <div class="slider-top">
          <label for="height">Height</label>
          <output id="height-out" for="height">1560</output>
        </div>
        <input id="height" type="range" min="480" max="2000" value="1560" step="20">
      </div>

      <p id="status" class="status" role="status">Loading photos…</p>
    </aside>

    <main class="stage">
      <div class="frame" id="frame">
        <canvas id="collage" width="880" height="1560" aria-label="Generated photo collage"></canvas>
      </div>
    </main>

    <footer class="bar">
      <button type="button" id="generate" disabled>Generate</button>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
